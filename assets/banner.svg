<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#15102a" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0" />
    </radialGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .pulsing-glow-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
      }
      .pulsing-glow-2 {
        animation: pulse2 6s ease-in-out infinite alternate;
      }
      .flow-1 {
        animation: flowMove 7s linear infinite;
      }
      .flow-2 {
        animation: flowMove 9s linear infinite 2s;
      }
      .flow-3 {
        animation: flowMove 6s linear infinite 4s;
      }

      @keyframes pulse1 {
        0% { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
        100% { transform: translate(40px, 20px) scale(1.15); opacity: 0.9; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        100% { transform: translate(-30px, -20px) scale(1.2); opacity: 0.85; }
      }
      @keyframes flowMove {
        0% { transform: translateX(-400px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Ambient Glow Circles -->
  <g class="pulsing-glow-1">
    <circle cx="280" cy="180" r="260" fill="url(#glowLeft)" />
  </g>
  <g class="pulsing-glow-2">
    <circle cx="950" cy="220" r="240" fill="url(#glowRight)" />
  </g>

  <!-- Background Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Dynamic Flow Lines in Background -->
  <g>
    <rect class="flow-1" y="80" width="320" height="2" rx="1" fill="url(#flowGrad)" />
    <rect class="flow-2" y="270" width="400" height="2" rx="1" fill="url(#flowGrad)" />
    <rect class="flow-3" y="315" width="260" height="2" rx="1" fill="url(#flowGrad)" />
  </g>

  <!-- Foreground Content Group (Always Sharp & Unobscured) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    
    <!-- Top Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1.2" />
      <text y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" fill="url(#titleGrad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      Partner API Sharing &amp; Ecosystem
    </text>

    <!-- Subtitle (2 Lines for Crisp Scaling) -->
    <text x="600" y="185" fill="#94a3b8" font-size="17" font-weight="400">
      Curated platforms, gateways, and developer portals for publishing, securing,
    </text>
    <text x="600" y="212" fill="#94a3b8" font-size="17" font-weight="400">
      monetizing, and onboarding partners to APIs.
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(600, 268)">
      <!-- Pill 1: API Gateways -->
      <g transform="translate(-400, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="72.5" y="22" fill="#38bdf8" font-size="13" font-weight="600">🌐 API Gateways</text>
      </g>

      <!-- Pill 2: Developer Portals -->
      <g transform="translate(-235, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="82.5" y="22" fill="#e2e8f0" font-size="13" font-weight="500">📑 Developer Portals</text>
      </g>

      <!-- Pill 3: B2B & EDI Onboarding -->
      <g transform="translate(-50, 0)">
        <rect x="0" y="0" width="190" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="95" y="22" fill="#e2e8f0" font-size="13" font-weight="500">🤝 B2B &amp; EDI Onboarding</text>
      </g>

      <!-- Pill 4: Access Governance -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="80" y="22" fill="#e2e8f0" font-size="13" font-weight="500">🔐 Access Governance</text>
      </g>

      <!-- Pill 5: AI & LLM Gateways -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="85" y="22" fill="#38bdf8" font-size="13" font-weight="600">🤖 AI &amp; LLM Gateways</text>
      </g>
    </g>

  </g>
</svg>
