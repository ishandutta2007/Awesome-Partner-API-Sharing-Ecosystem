<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          position: relative;
          width: 100%;
          height: 360px;
          background: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #15102a 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          overflow: hidden;
          border-radius: 14px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Dynamic animated particles & glows */
        .ambient-glow {
          position: absolute;
          width: 450px;
          height: 450px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 40%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
          filter: blur(40px);
          animation: pulseGlow 8s ease-in-out infinite alternate;
          z-index: 1;
        }

        .ambient-glow-2 {
          position: absolute;
          right: 5%;
          bottom: -20%;
          width: 350px;
          height: 350px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(99, 102, 241, 0.1) 40%, rgba(0,0,0,0) 70%);
          border-radius: 50%;
          filter: blur(40px);
          animation: pulseGlow2 6s ease-in-out infinite alternate;
          z-index: 1;
        }

        @keyframes pulseGlow {
          0% { transform: scale(0.9) translate(-10%, -10%); opacity: 0.6; }
          100% { transform: scale(1.2) translate(10%, 10%); opacity: 0.9; }
        }

        @keyframes pulseGlow2 {
          0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
          100% { transform: scale(1.3) translate(-15%, -10%); opacity: 0.85; }
        }

        /* Flowing grid background */
        .grid-overlay {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
          z-index: 2;
        }

        /* Animated connection lines/flows in background */
        .flow-line {
          position: absolute;
          height: 2px;
          background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.8), rgba(56, 189, 248, 0.8), transparent);
          border-radius: 2px;
          animation: flowMove 6s linear infinite;
          z-index: 2;
        }

        .flow-1 { top: 22%; left: -30%; width: 50%; animation-delay: 0s; }
        .flow-2 { top: 78%; left: -30%; width: 60%; animation-delay: 2.5s; animation-duration: 7s; }
        .flow-3 { top: 88%; left: -20%; width: 40%; animation-delay: 4s; animation-duration: 5s; }

        @keyframes flowMove {
          0% { transform: translateX(0); opacity: 0; }
          20% { opacity: 0.8; }
          80% { opacity: 0.8; }
          100% { transform: translateX(300%); opacity: 0; }
        }

        /* Foreground Content */
        .content-wrap {
          position: relative;
          z-index: 10;
          text-align: center;
          padding: 0 24px;
          max-width: 900px;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(99, 102, 241, 0.15);
          border: 1px solid rgba(129, 140, 248, 0.35);
          color: #a5b4fc;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          padding: 6px 16px;
          border-radius: 9999px;
          margin-bottom: 16px;
          backdrop-filter: blur(8px);
          box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .title {
          font-size: 42px;
          font-weight: 800;
          line-height: 1.15;
          margin: 0 0 12px 0;
          background: linear-gradient(135deg, #ffffff 20%, #cbd5e1 60%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: -0.02em;
          text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
          font-size: 17px;
          line-height: 1.5;
          color: #94a3b8;
          margin: 0 auto 22px auto;
          max-width: 720px;
          font-weight: 400;
        }

        /* Floating Pill Tags (under the text, non-blocking) */
        .tag-row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
        }

        .tag-item {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #e2e8f0;
          font-size: 12px;
          font-weight: 500;
          padding: 5px 14px;
          border-radius: 6px;
          backdrop-filter: blur(4px);
          transition: border-color 0.2s;
        }

        .tag-accent {
          background: rgba(56, 189, 248, 0.1);
          border-color: rgba(56, 189, 248, 0.25);
          color: #38bdf8;
        }
      </style>

      <div class="banner-container">
        <div class="ambient-glow"></div>
        <div class="ambient-glow-2"></div>
        <div class="grid-overlay"></div>

        <div class="flow-line flow-1"></div>
        <div class="flow-line flow-2"></div>
        <div class="flow-line flow-3"></div>

        <div class="content-wrap">
          <div class="badge-pill">
            <span>⚡ Enterprise &amp; Open-Source</span>
          </div>
          <h1 class="title">Partner API Sharing &amp; Ecosystem</h1>
          <p class="subtitle">
            Curated platforms, gateways, and developer portals for publishing, securing, monetizing, and onboarding partners to APIs.
          </p>
          <div class="tag-row">
            <span class="tag-item tag-accent">🌐 API Gateways</span>
            <span class="tag-item">📑 Developer Portals</span>
            <span class="tag-item">🤝 B2B &amp; EDI Onboarding</span>
            <span class="tag-item">🔐 Access Governance</span>
            <span class="tag-item tag-accent">🤖 AI &amp; LLM Gateways</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
