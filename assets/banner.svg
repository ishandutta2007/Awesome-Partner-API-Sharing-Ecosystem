<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#15102a"/></linearGradient><radialGradient id="glowLeft" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".35"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".15"/><stop offset="100%" stop-color="#0d1527" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".1"/><stop offset="100%" stop-color="#0d1527" stop-opacity="0"/></radialGradient><linearGradient id="flowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse1{0%{transform:translate(0,0) scale(.9);opacity:.6}}@keyframes pulse2{0%{transform:translate(0,0) scale(1);opacity:.5}}@keyframes flowMove{0%{transform:translateX(-400px);opacity:0}15%,85%{opacity:.8}}.pulsing-glow-1{animation:pulse1 7s ease-in-out infinite alternate}.pulsing-glow-2{animation:pulse2 6s ease-in-out infinite alternate}.flow-1{animation:flowMove 7s linear infinite}.flow-2{animation:flowMove 9s linear infinite 2s}.flow-3{animation:flowMove 6s linear infinite 4s}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="16"/><g class="pulsing-glow-1"><circle cx="280" cy="180" r="260" fill="url(#glowLeft)"/></g><g class="pulsing-glow-2"><circle cx="950" cy="220" r="240" fill="url(#glowRight)"/></g><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g><rect width="320" height="2" y="80" fill="url(#flowGrad)" class="flow-1" rx="1"/><rect width="400" height="2" y="270" fill="url(#flowGrad)" class="flow-2" rx="1"/><rect width="260" height="2" y="315" fill="url(#flowGrad)" class="flow-3" rx="1"/></g><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle"><g transform="translate(600, 52)"><rect width="280" height="32" x="-140" y="-16" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1.2" rx="16"/><text y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE</text></g><text x="600" y="142" fill="url(#titleGrad)" font-size="40" font-weight="800" letter-spacing="-.5">Partner API Sharing &amp; Ecosystem</text><text x="600" y="185" fill="#94a3b8" font-size="17" font-weight="400">Curated platforms, gateways, and developer portals for publishing, securing,</text><text x="600" y="212" fill="#94a3b8" font-size="17" font-weight="400">monetizing, and onboarding partners to APIs.</text><g><g transform="translate(600, 268) translate(-400, 0)"><rect width="145" height="34" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" rx="8"/><text x="72.5" y="22" fill="#38bdf8" font-size="13" font-weight="600">🌐 API Gateways</text></g><g transform="translate(600, 268) translate(-235, 0)"><rect width="165" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="82.5" y="22" fill="#e2e8f0" font-size="13" font-weight="500">📑 Developer Portals</text></g><g transform="translate(600, 268) translate(-50, 0)"><rect width="190" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="95" y="22" fill="#e2e8f0" font-size="13" font-weight="500">🤝 B2B &amp; EDI Onboarding</text></g><g transform="translate(600, 268) translate(160, 0)"><rect width="160" height="34" x="0" y="0" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="80" y="22" fill="#e2e8f0" font-size="13" font-weight="500">🔐 Access Governance</text></g><g transform="translate(600, 268) translate(340, 0)"><rect width="170" height="34" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" rx="8"/><text x="85" y="22" fill="#38bdf8" font-size="13" font-weight="600">🤖 AI &amp; LLM Gateways</text></g></g></g></svg>